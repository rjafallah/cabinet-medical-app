spring.application.name=cabinet-medical

# configuration de la base de données
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cabinet_medical}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:amine}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:amine}

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
