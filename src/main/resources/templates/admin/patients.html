<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <title>Gestion des patients</title>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-danger px-3">
    <span class="navbar-brand">🏥 Cabinet Médical — Admin</span>
    <form th:action="@{/deconnexion}" method="POST">
        <button type="submit" class="btn btn-outline-light btn-sm">
            Déconnexion
        </button>
    </form>
</nav>

<div class="container mt-4">

    <h3 class="mb-3">👥 Liste des patients</h3>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-danger">
                    <tr>
                        <th>Nom</th>
                        <th>Prénom</th>
                        <th>Date de naissance</th>
                        <th>Téléphone</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="patient : ${patients}">
                        <td th:text="${patient.nom}"></td>
                        <td th:text="${patient.prenom}"></td>
                        <td th:text="${patient.dateNaissance}"></td>
                        <td th:text="${patient.telephone}"></td>
                        <td>
                            <a th:href="@{/admin/supprimer-patient/{id}
                                        (id=${patient.id})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm(
                                   'Supprimer ce patient ?')">
                                Supprimer
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <a th:href="@{/admin/tableau-de-bord}"
       class="btn btn-secondary mt-3">
        ← Retour
    </a>

</div>

</body>
</html>
