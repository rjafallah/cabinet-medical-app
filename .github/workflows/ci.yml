name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn test -B

  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
      - name: Build et push
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/cabinet-medical:${GITHUB_SHA::7}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

  update-image-tag:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le repo gitops
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/cabinet-medical-gitops
          token: ${{ secrets.GITOPS_PAT }}
      - name: Mettre à jour le tag de l'image et pousser
        run: |
          TAG=${GITHUB_SHA::7}
          yq -i ".image.tag = \"$TAG\"" envs/dev/values.yaml
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git commit -am "ci: bump image tag to $TAG"
          git push
