<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <title>Ajouter une ordonnance</title>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success px-3">
    <span class="navbar-brand">🏥 Cabinet Médical</span>
    <form th:action="@{/deconnexion}" method="POST">
        <button type="submit" class="btn btn-outline-light btn-sm">
            Déconnexion
        </button>
    </form>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h4 class="card-title mb-4">
                        📋 Ordonnance pour
                        <span th:text="${patient.nom
                                        + ' ' + patient.prenom}">
                        </span>
                    </h4>

                    <form th:action="@{/medecin/sauvegarder-ordonnance/{id}
                                     (id=${patient.id})}"
                          th:object="${ordonnance}"
                          method="POST">

                        <div class="mb-3">
                            <label class="form-label">Contenu</label>
                            <textarea th:field="*{contenu}"
                                      class="form-control"
                                      rows="6"
                                      placeholder="Médicaments, dosages...">
                            </textarea>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit"
                                    class="btn btn-success">
                                Sauvegarder
                            </button>
                            <a th:href="@{/medecin/patients}"
                               class="btn btn-secondary">
                                Annuler
                            </a>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
