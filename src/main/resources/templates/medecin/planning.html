<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <title>Mon planning</title>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success px-3">
    <span class="navbar-brand">🏥 Cabinet Médical</span>
    <form th:action="@{/deconnexion}" method="POST">
        <button type="submit" class="btn btn-outline-light btn-sm">
            Déconnexion
        </button>
    </form>
</nav>

<div class="container mt-4">

    <h3 class="mb-3">📅 Mon planning</h3>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-success">
                    <tr>
                        <th>Date</th>
                        <th>Motif</th>
                        <th>Patient</th>
                        <th>Statut</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="rdv : ${rendezVous}">
                        <td th:text="${rdv.dateHeure}"></td>
                        <td th:text="${rdv.motif}"></td>
                        <td th:text="${rdv.patient.nom
                                      + ' ' + rdv.patient.prenom}">
                        </td>
                        <td>
                            <span th:text="${rdv.statut}"
                                  th:classappend="${rdv.statut == 'CONFIRME'}
                                  ? 'badge bg-success'
                                  : 'badge bg-warning text-dark'">
                            </span>
                        </td>
                        <td>
                            <a th:href="@{/medecin/confirmer-rendez-vous/{id}
                                        (id=${rdv.id})}"
                               class="btn btn-success btn-sm">
                                Confirmer
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <a th:href="@{/medecin/tableau-de-bord}"
       class="btn btn-secondary mt-3">
        ← Retour
    </a>

</div>

</body>
</html>
