<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <title>Liste des médecins</title>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary px-3">
    <span class="navbar-brand">🏥 Cabinet Médical</span>
    <form th:action="@{/deconnexion}" method="POST">
        <button type="submit" class="btn btn-outline-light btn-sm">
            Déconnexion
        </button>
    </form>
</nav>

<div class="container mt-4">

    <h3 class="mb-3">👨‍⚕️ Liste des médecins</h3>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-primary">
                    <tr>
                        <th>Nom</th>
                        <th>Prénom</th>
                        <th>Spécialité</th>
                        <th>Téléphone</th>
                        <th>Email</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="medecin : ${medecins}">
                        <td th:text="${medecin.nom}"></td>
                        <td th:text="${medecin.prenom}"></td>
                        <td th:text="${medecin.specialite}"></td>
                        <td th:text="${medecin.telephone}"></td>
                        <td th:text="${medecin.email}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <a th:href="@{/patient/tableau-de-bord}" class="btn btn-secondary mt-3">
        ← Retour
    </a>

</div>

</body>
</html>
