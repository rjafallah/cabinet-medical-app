<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <title>Tableau de bord Médecin</title>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success px-3">
    <span class="navbar-brand">🏥 Cabinet Médical</span>
    <span class="text-white">
        Dr. <sec:authentication property="principal.username" />
    </span>
    <form th:action="@{/deconnexion}" method="POST">
        <button type="submit" class="btn btn-outline-light btn-sm">
            Déconnexion
        </button>
    </form>
</nav>

<div class="container mt-4">

    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <h4 class="card-title">
                👨‍⚕️ Dr.
                <span th:text="${medecin.nom
                                + ' ' + medecin.prenom}"></span>
            </h4>
            <p class="mb-0">
                🩺 Spécialité :
                <span th:text="${medecin.specialite}"></span>
            </p>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6 mb-3">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h5>📅 Mon planning</h5>
                    <a th:href="@{/medecin/planning}"
                       class="btn btn-success mt-2">
                        Voir
                    </a>
                </div>
            </div>
        </div>
        <div class="col-md-6 mb-3">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h5>👥 Mes patients</h5>
                    <a th:href="@{/medecin/patients}" class="btn btn-info mt-2">
                        Voir
                    </a>
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
