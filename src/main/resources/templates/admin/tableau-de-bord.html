<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <title>Tableau de bord Admin</title>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-danger px-3">
    <span class="navbar-brand">🏥 Cabinet Médical — Admin</span>
    <form th:action="@{/deconnexion}" method="POST">
        <button type="submit" class="btn btn-outline-light btn-sm">
            Déconnexion
        </button>
    </form>
</nav>

<div class="container mt-4">

    <h3 class="mb-4">⚙️ Tableau de bord Administrateur</h3>

    <!-- Statistiques -->
    <div class="row mb-4">
        <div class="col-md-4 mb-3">
            <div class="card text-white bg-success shadow-sm">
                <div class="card-body text-center">
                    <h5>👨‍⚕️ Médecins</h5>
                    <h2 th:text="${nombreMedecins}"></h2>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="card text-white bg-primary shadow-sm">
                <div class="card-body text-center">
                    <h5>👥 Patients</h5>
                    <h2 th:text="${nombrePatients}"></h2>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="card text-white bg-warning shadow-sm">
                <div class="card-body text-center">
                    <h5>📅 Rendez-vous</h5>
                    <h2 th:text="${nombreRendezVous}"></h2>
                </div>
            </div>
        </div>
    </div>

    <!-- Actions -->
    <div class="row">
        <div class="col-md-6 mb-3">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <h5>👨‍⚕️ Gérer les médecins</h5>
                    <a th:href="@{/admin/medecins}"
                       class="btn btn-success mt-2">
                        Voir la liste
                    </a>
                </div>
            </div>
        </div>
        <div class="col-md-6 mb-3">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <h5>👥 Gérer les patients</h5>
                    <a th:href="@{/admin/patients}"
                       class="btn btn-primary mt-2">
                        Voir la liste
                    </a>
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
